# Append these entries to the device runtime function registry.
# Preserve existing functions. This file never modifies the reference source checkout.

[device_function]
name=open_meeting_recording
display_name=会议记录
action_name=打开
script_path=/userdata/apps/memo-meeting/memo-meeting-open.sh
timeout_ms=300000
trigger_intents=打开会议记录|开启会议记录|开始会议记录|启动会议记录应用
misfire_constraints=仅当用户明确要求启动本机会议记录应用或开始录音时执行。不要把讨论会议内容、查看历史会议、描述他人的操作、引用指令或否定句误判为开启。

[device_function]
name=close_meeting_recording
display_name=会议记录
action_name=关闭
script_path=/userdata/apps/memo-meeting/memo-meeting-close.sh
timeout_ms=60000
trigger_intents=关闭会议记录|停止会议记录|结束会议记录|停止本次会议录音
misfire_constraints=仅当用户明确要求结束本机正在进行的会议录音时执行。不要把结束聊天、会议议题讨论、关闭其他应用、引用指令或否定句误判为停止录音。

[device_function]
name=bind_meeting_account
display_name=会议账号
action_name=绑定
script_path=/userdata/apps/memo-meeting/memo-meeting-bind.sh
timeout_ms=300000
trigger_intents=绑定会议账号|绑定会议眼镜|扫描会议绑定二维码|扫码绑定会议账号
misfire_constraints=仅当用户明确要求本机眼镜扫描网页上的会议绑定二维码时执行。不要把讨论绑定方法、询问绑定状态、引用指令或否定句误判为扫码。眼镜看向网页二维码，不通过语音传递数字或凭证。
